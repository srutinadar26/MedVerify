services:
  - type: web
    name: medverify-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python backend/manage.py migrate"
    startCommand: "cd backend && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "medverify-mrp6.onrender.com,.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://med-verify-iota.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://med-verify-iota.vercel.app,https://medverify-mrp6.onrender.com"
